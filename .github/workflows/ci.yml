name: CI

on:
  push:
    branches:
      - dev
      - 'chatgpt/**'
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  build:
    name: Build and test solution
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore GIPractice.sln

      - name: Build
        run: dotnet build GIPractice.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test GIPractice.sln --configuration Release --no-build --no-restore
